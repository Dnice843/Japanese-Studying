name: Apply pronunciation fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-pronunciation-fix.yml

permissions:
  contents: write

jobs:
  update-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make audio read every listed alternative
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          helper = r'''function pronunciationText(c){
          if(!/[／/・]/.test(c.jp))return c.audio;
          const special={
          "これ（それ／あれ）は 何ですか？":"これは何ですか。それは何ですか。あれは何ですか。",
          "私は 15／19／22 歳です":"私は十五歳です。私は十九歳です。私は二十二歳です。"
          };
          if(special[c.jp])return special[c.jp];
          return c.jp.replace(/（(?:casual|more polite)）|\((?:casual|more polite)\)/gi,"").replace(/_{2,}|〜+/g,"").replace(/[／/・]/g,"。").replace(/[()（）]/g,"").replace(/\s+/g," ").trim();
          }
          '''

          if "function pronunciationText(c)" not in html:
              marker = "function speak(){"
              if marker not in html:
                  raise SystemExit("Could not find the pronunciation function marker")
              html = html.replace(marker, helper + marker, 1)

          old = "new SpeechSynthesisUtterance(c.audio)"
          new = "new SpeechSynthesisUtterance(pronunciationText(c))"
          if old in html:
              html = html.replace(old, new, 1)
          elif new not in html:
              raise SystemExit("Could not find the speech text expression")

          path.write_text(html, encoding="utf-8")

      - name: Commit the update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Read all listed pronunciation alternatives"
          git push
